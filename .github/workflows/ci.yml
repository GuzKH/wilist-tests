name: CI

on: [push, pull_request]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wilist-tests
        uses: actions/checkout@v4

      - name: Checkout wilist app
        uses: actions/checkout@v4
        with:
          repository: ppeerr/wilist
          token: ${{ secrets.PPEERR_PAT }}
          path: wilist-app

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React UI
        working-directory: wilist-app/web
        run: |
          npm install
          npm run build

      - name: Build wilist binary
        working-directory: wilist-app
        run: go build -o wilist .

      - name: Start wilist
        working-directory: wilist-app
        run: |
          PORT=8081 ./wilist &
          sleep 2

      - name: Install Newman + Allure reporter
        run: npm install -g newman newman-reporter-allure

      # Диагностика: куда npm ставит глобальные пакеты и виден ли там репортер
      - name: Debug npm global path
        run: |
          echo "npm root -g: $(npm root -g)"
          echo "NODE_PATH: ${NODE_PATH:-<empty>}"
          echo "--- contents of global node_modules ---"
          ls "$(npm root -g)"

      # Диагностика
      - name: Check allure reporter
        run: |
          echo "--- installed version ---"
          npm list -g newman-reporter-allure || true
          echo "--- newman help, allure mentions ---"
          newman run --help 2>&1 | grep -i allure || echo "no allure options in help"

      # continue-on-error нужен, чтобы упавшие тесты не обрывали job раньше времени —
      # иначе шаг upload ниже не получит результаты для отчёта
      - name: Run Postman tests
        env:
          ALLURE_RESULTS_DIR: allure-results-api
        run: |
          newman run postman/wilist.postman_collection.json \
            -e postman/wilist.postman_environment.json \
            --env-var baseUrl=localhost:8081 \
            --reporters cli,allure \
            --reporter-allure-resultsDir allure-results-api
        continue-on-error: true

      # Диагностика: создалась ли папка с результатами Allure после прогона
      - name: Debug allure results
        run: |
          echo "--- allure-results-api (ожидаемый путь) ---"
          ls -la allure-results-api || echo "directory does not exist"
          echo "--- allure-results (дефолтный путь репортера) ---"
          ls -la allure-results || echo "directory does not exist"
          echo "--- поиск любых allure-папок в рабочей директории ---"
          find . -maxdepth 2 -type d -name "*allure*" || true

      # if: always() — выгружаем результаты, даже если предыдущий шаг завершился с ошибкой
      - name: Upload API allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results-api

  e2e-ui-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wilist-tests
        uses: actions/checkout@v4

      - name: Checkout wilist app
        uses: actions/checkout@v4
        with:
          repository: ppeerr/wilist
          token: ${{ secrets.PPEERR_PAT }}
          path: wilist-app

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React UI
        working-directory: wilist-app/web
        run: |
          npm install
          npm run build

      - name: Build wilist binary
        working-directory: wilist-app
        run: go build -o wilist .

      - name: Start wilist
        working-directory: wilist-app
        run: |
          PORT=8081 ./wilist &
          sleep 2

      - name: Install Playwright deps
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test
        continue-on-error: true

      # Диагностика: создалась ли папка с результатами Allure после прогона UI-тестов
      - name: Debug UI allure results
        working-directory: e2e
        run: |
          echo "Contents of e2e/allure-results:"
          ls -la allure-results || echo "directory does not exist"

      - name: Upload UI allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: e2e/allure-results

  # Собирает результаты из обеих job выше в один общий HTML-отчёт Allure
  # needs + if: always() — запускается после api-tests и e2e-ui-tests, даже если одна из них упала
  allure-report:
    needs: [api-tests, e2e-ui-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # continue-on-error — чтобы отсутствие одного из артефактов не валило весь job;
      # так будет видно хотя бы ту часть отчёта, которая собралась
      - name: Download API allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-api
          path: allure-results/api

      - name: Download UI allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-ui
          path: allure-results/ui

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate combined Allure report
        run: |
          mkdir -p allure-results/api allure-results/ui
          allure generate allure-results/api allure-results/ui --clean -o allure-report

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
