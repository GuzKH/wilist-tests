name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Nightly run: catches regressions in the ppeerr/wilist app itself,
  # not only changes in this test repo. 03:17 UTC — off the round hour,
  # when GitHub's scheduler is busiest.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR instead of letting them queue
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.1'
  NODE_VERSION: '20'
  WILIST_PORT: '8081'

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout wilist-tests
        uses: actions/checkout@v4

      # Build + start the private app inside this job (see
      # .github/actions/build-and-start-wilist). No binary artifact is
      # uploaded, so nothing from ppeerr/wilist is downloadable from this public repo.
      - name: Build and start wilist
        uses: ./.github/actions/build-and-start-wilist
        with:
          token: ${{ secrets.PPEERR_PAT }}
          port: ${{ env.WILIST_PORT }}
          go-version: ${{ env.GO_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Versions pinned so a new reporter/newman release can't silently
      # change behavior or break the Allure output — verify these match
      # what you've tested locally (npm list -g --depth=0) before relying on them
      - name: Install Newman + Allure reporter
        run: npm install -g newman@6.2.2 newman-reporter-allure@3.12.2

      # No continue-on-error: a real test failure must fail the job.
      # if: always() on the upload step below is enough to still get results.
      - name: Run Postman tests
        env:
          ALLURE_RESULTS_DIR: allure-results-api
        run: |
          newman run postman/wilist.postman_collection.json \
            -e postman/wilist.postman_environment.json \
            --env-var baseUrl=localhost:${{ env.WILIST_PORT }} \
            --reporters cli,allure \
            --reporter-allure-resultsDir allure-results-api

      - name: Upload API allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results-api

  e2e-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout wilist-tests
        uses: actions/checkout@v4

      # Build + start the private app inside this job (see
      # .github/actions/build-and-start-wilist). No binary artifact is
      # uploaded, so nothing from ppeerr/wilist is downloadable from this public repo.
      - name: Build and start wilist
        uses: ./.github/actions/build-and-start-wilist
        with:
          token: ${{ secrets.PPEERR_PAT }}
          port: ${{ env.WILIST_PORT }}
          go-version: ${{ env.GO_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright deps
        working-directory: e2e
        run: npm ci

      # Cache the downloaded browser binaries themselves (the slow part of
      # `playwright install`), keyed off the lockfile so it busts on version bumps
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: e2e
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      # No continue-on-error here either — same reasoning as the Postman job
      - name: Run Playwright tests
        working-directory: e2e
        # --fail-on-flaky-tests: a test that passes only on retry fails the run,
        # so retries can no longer hide a real failure behind a green CI
        run: npx playwright test --project=chromium --fail-on-flaky-tests

      - name: Upload UI allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: e2e/allure-results

      # Merges results from both test jobs into one combined Allure report.
  # needs + if: always() — runs even if one of the test jobs failed.
  allure-report:
    needs: [api-tests, e2e-ui-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job may write to the repo: it pushes the report to the gh-pages branch.
    # Test jobs keep the read-only permissions set at the top of the file.
    permissions:
      contents: write
    # One publish at a time, so two runs (e.g. nightly + push) don't overwrite gh-pages in parallel
    concurrency:
      group: allure-publish
      cancel-in-progress: false
    steps:
      # History step 1 of 2: check out the gh-pages branch, where the previous
      # published report lives (including its history/ folder with past runs).
      # Only on main — PR reports are one-off artifacts without history.
      # continue-on-error: on the very first publish gh-pages doesn't exist yet.
      - name: Get previous published report
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # continue-on-error here (not on the test steps) is fine: a missing
      # artifact from one job just means a smaller report, not a false-green build
      - name: Download API allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-api
          path: allure-results/api

      - name: Download UI allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-ui
          path: allure-results/ui

      # History step 2 of 2: Allure reads past runs from a history/ folder inside
      # a results directory. Copy it from the previous report into the API results
      # folder (any results folder works — Allure merges them into one report).
      - name: Add previous history to results
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p allure-results/api
          if [ -d gh-pages/ci/history ]; then
            cp -r gh-pages/ci/history allure-results/api/history
            echo "History copied from the previous report"
          else
            echo "No previous history yet - this report starts a new one"
          fi

      - name: Install Allure CLI
        run: npm install -g allure-commandline@2.29.0

      - name: Generate combined Allure report
        run: |
          mkdir -p allure-results/api allure-results/ui
          allure generate allure-results/api allure-results/ui --clean -o allure-report

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      # Publish only from main (push, nightly, manual run).
      # PR reports stay as downloadable artifacts so they don't mix into the published report.
      - name: Publish report to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          # Each workflow publishes into its own folder, so ci.yml and cross-platform.yml
          # don't overwrite each other's reports on the gh-pages branch
          destination_dir: ci
