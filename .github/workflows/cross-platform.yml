name: Cross-platform E2E

# Manual only: this is an OS matrix (ubuntu/macos/windows), and GitHub bills
# macOS runners at 10x and Windows at 2x the Linux rate. Running it on every
# push like the main `ci.yml` would be slow and burn minutes fast, so it's
# opt-in via the Actions tab instead.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.1'
  NODE_VERSION: '20'
  WILIST_PORT: '8081'

jobs:
  e2e-cross-os:
    strategy:
      # fail-fast: false — one failing combination shouldn't cancel the rest;
      # we want results from every combination regardless.
      fail-fast: false
      matrix:
        # Every combination is spelled out explicitly (not a plain
        # os x browser cross product) so each row can carry its own `ext`.
        # webkit/firefox only on ubuntu for now — cheapest runner, just to
        # prove the browser dimension works before spending macOS/Windows
        # minutes on it too.
        include:
          - os: ubuntu-latest
            browser: chromium
            ext: ''
          - os: ubuntu-latest
            browser: webkit
            ext: ''
          - os: ubuntu-latest
            browser: firefox
            ext: ''
          - os: macos-latest
            browser: chromium
            ext: ''
          - os: windows-latest
            browser: chromium
            # Go builds `wilist.exe` on Windows, not `wilist` — needed below
            # wherever the binary name/path is used.
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout wilist-tests
        uses: actions/checkout@v4

      - name: Checkout wilist app
        uses: actions/checkout@v4
        with:
          repository: ppeerr/wilist
          token: ${{ secrets.PPEERR_PAT }}
          path: wilist-app

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: wilist-app/web/package-lock.json

      - name: Build React UI
        working-directory: wilist-app/web
        run: |
          npm ci
          npm run build

      - name: Build wilist binary
        working-directory: wilist-app
        run: go build -o wilist${{ matrix.ext }} .

      # `shell: bash` pins the script to Git Bash on the Windows runner too
      # (it ships with actions/checkout), so the same curl/sleep-loop syntax
      # works identically on all three OSes instead of writing it twice.
      - name: Start wilist
        shell: bash
        working-directory: wilist-app
        run: |
          chmod +x ./wilist${{ matrix.ext }}
          PORT=${{ env.WILIST_PORT }} ./wilist${{ matrix.ext }} &
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${{ env.WILIST_PORT }}/health" > /dev/null; then
              echo "wilist is up"
              exit 0
            fi
            sleep 1
          done
          echo "wilist did not become healthy in time" >&2
          exit 1

      - name: Install Playwright deps
        working-directory: e2e
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: e2e
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install

      # Runs every time, cache hit or not: system libraries (e.g. WebKit's
      # libevent) aren't part of the cached ~/.cache/ms-playwright directory
      # above, they're OS packages on a fresh runner VM — so gating this
      # behind the same cache-hit check (as `--with-deps` did before) skips
      # them on a cache hit and crashes webkit. Known trap, documented in
      # "CI - GitHub Actions" (Obsidian) from the ci.yml chromium-only note.
      - name: Install Playwright system deps
        working-directory: e2e
        run: npx playwright install-deps

      # allure-js-commons + the allure-playwright reporter are already wired
      # into playwright.config.ts, so this produces e2e/allure-results same
      # as any other run — nothing extra to configure here.
      - name: Run Playwright tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:${{ env.WILIST_PORT }}
        run: npx playwright test --project=${{ matrix.browser }}

      # Version pinned to match ci.yml's allure-report job — keep them in sync.
      # Raw results only: reports are generated in one place (the allure-reports
      # job below), so the matrix jobs stay "tests only" and need no extra tools.
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.os }}-${{ matrix.browser }}
          path: e2e/allure-results

  # Builds one Allure report per OS + browser combination from the matrix results
  # and, on main, publishes them to GitHub Pages under cross-platform/.
  # Runs once, on ubuntu, after all matrix jobs, even if some of them failed:
  # failures are exactly what the reports are for.
  allure-reports:
    needs: e2e-cross-os
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job may write to the repo (it pushes to gh-pages); matrix jobs stay read-only
    permissions:
      contents: write
    # Same group as the publish job in ci.yml: publishes from both workflows
    # wait for each other instead of pushing to gh-pages at the same time
    concurrency:
      group: allure-publish
      cancel-in-progress: false
    steps:
      # Previously published reports (with their history/ folders) live on gh-pages.
      # Only on main; continue-on-error: the very first publish has no cross-platform/ yet.
      - name: Get previous published reports
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # Every allure-results-<os>-<browser> artifact lands in its own folder:
      # results/allure-results-ubuntu-latest-chromium/, results/allure-results-macos-latest-chromium/, ...
      - name: Download all matrix results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: results

      # Version pinned to match ci.yml's allure-report job — keep them in sync.
      - name: Install Allure CLI
        run: npm install -g allure-commandline@2.29.0

      # For each combination: add history, failure categories, environment and
      # executor info to its results, then generate a report into site/<os>-<browser>/.
      - name: Generate one report per combination
        env:
          PPEERR_PAT: ${{ secrets.PPEERR_PAT }}
        run: |
          # Shared values for all combinations
          APP_COMMIT=$(git ls-remote "https://x-access-token:${PPEERR_PAT}@github.com/ppeerr/wilist.git" HEAD | cut -f1)
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          RUN_URL="${REPO_URL}/actions/runs/${{ github.run_id }}"
          RUN_NUMBER="${{ github.run_number }}"

          # Failure categories, same rules as in ci.yml — keep them in sync
          cat > categories.json <<'EOF'
          [
            {"name": "Infrastructure: app not reachable", "matchedStatuses": ["failed", "broken"], "messageRegex": ".*(ECONNREFUSED|ERR_CONNECTION_REFUSED|ECONNRESET|socket hang up).*"},
            {"name": "Timeouts", "matchedStatuses": ["failed", "broken"], "messageRegex": ".*([Tt]imeout|timed out).*"},
            {"name": "Product defects", "matchedStatuses": ["failed"]},
            {"name": "Test defects", "matchedStatuses": ["broken"]}
          ]
          EOF

          mkdir -p site
          for dir in results/allure-results-*; do
            [ -d "$dir" ] || continue   # no results at all (every matrix job failed early)
            combo="${dir#results/allure-results-}"   # e.g. ubuntu-latest-chromium
            os="${combo%-*}"                          # e.g. ubuntu-latest
            browser="${combo##*-}"                    # e.g. chromium
            echo "Generating report for ${combo}"

            # History: copy from the previous published report of the same combination (main only)
            if [ -d "gh-pages/cross-platform/${combo}/history" ]; then
              cp -r "gh-pages/cross-platform/${combo}/history" "$dir/history"
              echo "  history copied from the previous report"
            fi

            # Failure categories
            cp categories.json "$dir/categories.json"

            # Environment: what exactly was tested
            {
              echo "OS=${os}"
              echo "UI.Browser=${browser}"
              echo "App.Repository=ppeerr/wilist"
              echo "App.Commit=${APP_COMMIT}"
              echo "Tests.Commit=${{ github.sha }}"
              echo "Tests.Branch=${{ github.ref_name }}"
              echo "Go.Version=${{ env.GO_VERSION }}"
              echo "Node.Version=${{ env.NODE_VERSION }}"
            } > "$dir/environment.properties"

            # Executor: run number + link back to this run's logs
            printf '{"name":"GitHub Actions","type":"github","url":"%s","buildOrder":%s,"buildName":"Cross-platform #%s","buildUrl":"%s","reportUrl":"https://guzkh.github.io/wilist-tests/cross-platform/%s/","reportName":"wilist-tests: %s"}\n' \
              "$REPO_URL" "$RUN_NUMBER" "$RUN_NUMBER" "$RUN_URL" "$combo" "$combo" > "$dir/executor.json"

            allure generate "$dir" --clean -o "site/${combo}"
          done

      # Table of contents for cross-platform/: one row per combination with its
      # pass/fail counts (taken from each generated report's widgets/summary.json),
      # plus links back to all reports. Same look as the root index.html on gh-pages.
      - name: Build index page
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            cat <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>wilist-tests: cross-platform reports</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; line-height: 1.5; color: #222; }
              a { color: #0969da; }
              table { border-collapse: collapse; width: 100%; margin: 16px 0; }
              th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #ddd; }
              .ok { color: #1a7f37; font-weight: 600; }
              .fail { color: #cf222e; font-weight: 600; }
              .muted { color: #666; }
            </style>
          </head>
          <body>
            <h1>wilist-tests: cross-platform reports</h1>
            <p>UI tests (Playwright) on different OS and browsers, one Allure report per combination.</p>
          EOF
            echo "  <p class=\"muted\">Latest run: <a href=\"${RUN_URL}\">Cross-platform #${{ github.run_number }}</a></p>"
            echo '  <table>'
            echo '    <tr><th>OS + browser</th><th>Result</th></tr>'
            for d in site/*/; do
              combo=$(basename "$d")
              summary="${d}widgets/summary.json"
              if [ -f "$summary" ]; then
                # Counts from the generated report; "failed" here = failed + broken
                passed=$(jq '.statistic.passed' "$summary")
                failed=$(jq '.statistic.failed + .statistic.broken' "$summary")
                total=$(jq '.statistic.total' "$summary")
                if [ "$failed" -eq 0 ]; then
                  result="<span class=\"ok\">&#10003; ${passed}/${total} passed</span>"
                else
                  result="<span class=\"fail\">&#10007; ${failed} failed</span> / ${passed} passed"
                fi
              else
                result='<span class="muted">no data</span>'
              fi
              echo "    <tr><td><a href=\"${combo}/\">${combo}</a></td><td>${result}</td></tr>"
            done
            echo '  </table>'
            echo '  <p><a href="../">All reports</a> · <a href="../ci/">Main CI report (API + UI, chromium)</a></p>'
            echo '</body>'
            echo '</html>'
          } > index.html
          mv index.html site/index.html

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: allure-reports-cross-platform
          path: site

      # Publish only from main, into cross-platform/ on gh-pages.
      # The action cleans only that folder, so ci/ (the main report) is not touched.
      - name: Publish reports to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          destination_dir: cross-platform
